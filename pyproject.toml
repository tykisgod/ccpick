[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ccpick"
version = "0.1.0"
description = "Chrome profile picker and predictive account switching for Claude Code"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "ccpick contributors"}]
dependencies = ["claude-swap==0.26.0"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/tykisgod/ccpick"
Issues = "https://github.com/tykisgod/ccpick/issues"

[project.scripts]
ccpick = "ccpick_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ccpick_app = ["legacy/*", "legacy/autoswitch/*", "legacy/autoswitch/win/*", "resources/*", "resources/**/*"]
