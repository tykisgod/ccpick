name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.23'
      - name: Scan public files
        run: python tools/check_public.py
      - name: Install package and pinned dependency
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Isolated package and installer tests
        run: uv run --locked python tools/test_package.py
      - name: Decision regressions
        run: uv run --locked python tools/test_core.py
      - name: Portable runtime regressions
        run: uv run --locked python tools/test_profiles.py
      - name: Build distribution
        run: python tools/build_dist.py
      - name: Scan built distributions
        run: python tools/check_public.py --include-build
      - name: Parse PowerShell resources
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem src -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) { throw "PowerShell parse failure: $($_.Name): $errors" }
          }
      - name: Compile menu bar
        if: runner.os == 'macOS'
        run: swiftc src/ccpick_app/legacy/autoswitch/menubar-main.swift -o "$RUNNER_TEMP/ccpick-menubar" -framework Cocoa
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan committed history
        run: docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 git . --config .gitleaks.toml --redact --no-banner
