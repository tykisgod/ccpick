[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Generated export receipt digests; check_public.py verifies every digest against file bytes."
condition = "AND"
regexTarget = "line"
paths = ['''(^|[/\\])\.ccpick-export\.json$''']
regexes = ['''^\s*"[A-Za-z0-9_.\/-]+": "[0-9a-f]{64}",?\s*$''']
